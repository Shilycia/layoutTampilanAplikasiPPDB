<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sekolah - PASS SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#22AD73',
                            dark: '#2B4175',
                            light: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans min-h-screen flex items-center justify-center py-12 px-4">

    <div class="max-w-4xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <div class="md:w-1/3 bg-brand-dark p-10 text-white flex flex-col justify-between relative overflow-hidden">
            <div class="absolute -top-20 -left-20 w-64 h-64 bg-brand-primary/10 rounded-full blur-3xl"></div>
            
            <div class="relative z-10">
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-8 h-8 bg-brand-primary rounded-lg flex items-center justify-center text-white font-bold shadow-lg">P</div>
                    <span class="font-black text-sm tracking-tighter uppercase italic">Register Akun</span>
                </div>

                <h2 class="text-2xl font-bold leading-tight mb-8">Informasi Pendidikan Sebelumnya.</h2>
                
                <div class="space-y-6">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-full bg-brand-primary/20 flex items-center justify-center text-xs font-bold border-2 border-brand-primary/50 text-brand-primary">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Informasi Akun</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-full bg-brand-primary flex items-center justify-center text-xs font-bold border-2 border-brand-primary">2</div>
                        <span class="text-xs font-bold uppercase tracking-widest text-brand-primary">Data Sekolah</span>
                    </div>
                    <div class="flex items-center gap-4 opacity-40">
                        <div class="w-8 h-8 rounded-full bg-transparent flex items-center justify-center text-xs font-bold border-2 border-white">3</div>
                        <span class="text-xs font-bold uppercase tracking-widest">Konfirmasi</span>
                    </div>
                </div>
            </div>

            <div class="relative z-10 pt-10 border-t border-white/10">
                <p class="text-[10px] font-medium text-slate-400 leading-relaxed italic">
                    Data sekolah asal akan digunakan untuk keperluan verifikasi berkas ijazah oleh admin PPDB.
                </p>
            </div>
        </div>

        <div class="md:w-2/3 p-10 lg:p-14 bg-white">
            <div class="mb-8">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-black text-brand-dark uppercase tracking-tighter">Asal Sekolah</h3>
                    <span class="text-[10px] font-bold text-brand-primary bg-brand-primary/10 px-2 py-1 rounded italic uppercase">Step 2 of 3</span>
                </div>
                <p class="text-xs text-slate-400 font-medium mt-1">Masukkan informasi mengenai sekolah tempat Anda menempuh pendidikan sebelumnya.</p>
            </div>

            <form action="registerconfirm.html" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">NPSN Sekolah Asal</label>
                        <input type="number" placeholder="Contoh: 2010xxxx" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono outline-none focus:ring-1 focus:ring-brand-primary transition-all">
                    </div>
                    
                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Tahun Lulus</label>
                        <select class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-brand-primary transition-all">
                            <option>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            <option>Sebelumnya</option>
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Nama Sekolah (SMP/MTs Sederajat)</label>
                        <input type="text" placeholder="Masukkan nama sekolah asal" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-brand-primary transition-all">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Alamat Sekolah Asal</label>
                        <textarea rows="3" placeholder="Masukkan alamat lengkap sekolah asal..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-brand-primary transition-all"></textarea>
                    </div>
                </div>

                <div class="pt-6 flex flex-col md:flex-row gap-4">
                    <button type="button" class="w-full md:w-1/3 py-4 bg-white border border-slate-200 text-slate-400 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-slate-50 transition-all">
                        Kembali
                    </button>
                    <button type="submit" class="w-full md:w-2/3 py-4 bg-brand-primary text-white rounded-xl font-bold text-xs uppercase tracking-widest shadow-xl shadow-green-100 hover:bg-green-700 transition-all">
                        Konfirmasi Data
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
