<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Berkas - PASS SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ppdb: {
                            sidebar: '#2B4175',
                            primary: '#22AD73',
                            bg: '#F3F4F6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ppdb-bg font-sans text-slate-700">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-ppdb-sidebar text-white flex flex-col fixed h-full shadow-xl z-10 hidden md:flex">
            <div class="h-16 flex items-center px-6 border-b border-white/10">
                <span class="font-bold text-lg tracking-wide uppercase">PASS SYSTEM</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="flex items-center px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Dashboard PPDB
                </a>
                <a href="#" class="flex items-center px-4 py-3 bg-ppdb-primary/20 text-ppdb-primary rounded-lg font-medium border-r-4 border-ppdb-primary">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Verifikasi Berkas
                </a>
            </nav>
        </aside>

        <main class="flex-1 md:ml-64 flex flex-col h-screen overflow-hidden">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8 sticky top-0 z-20">
                <div class="flex items-center gap-4">
                    <a href="#" class="text-slate-400 hover:text-ppdb-primary transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <h1 class="text-sm font-bold text-slate-800 uppercase tracking-tighter">VERIFIKASI SISWA: ANDINI PUTRI</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span class="px-2 py-1 bg-amber-50 text-amber-600 text-[10px] font-bold rounded border border-amber-100 uppercase italic">Status: Menunggu Review</span>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-6">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
                    
                    <div class="lg:col-span-8 space-y-6">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[700px]">
                            <div class="p-4 bg-slate-50 border-b flex items-center justify-between">
                                <div class="flex gap-4">
                                    <button class="text-[11px] font-bold text-ppdb-primary border-b-2 border-ppdb-primary pb-1">Ijazah / SKL</button>
                                    <button class="text-[11px] font-bold text-slate-400 hover:text-slate-600">Kartu Keluarga</button>
                                    <button class="text-[11px] font-bold text-slate-400 hover:text-slate-600">Akta Kelahiran</button>
                                </div>
                                <button class="p-1.5 bg-white border rounded hover:bg-slate-100">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </button>
                            </div>
                            <div class="flex-1 bg-slate-200 flex items-center justify-center p-8 overflow-auto">
                                <div class="w-full max-w-2xl aspect-[1/1.4] bg-white shadow-2xl flex items-center justify-center text-slate-300">
                                    <div class="text-center">
                                        <svg class="w-20 h-20 mx-auto mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                        <p class="text-xs font-mono uppercase tracking-widest italic opacity-40">Preview Dokumen: Ijazah_Andini.pdf</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-4 space-y-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Profil Pendaftar</h3>
                            <div class="space-y-3">
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-400 font-bold uppercase">Nama Lengkap</span>
                                    <span class="text-sm font-bold text-slate-800">Andini Putri Pratama</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-400 font-bold uppercase">Asal Sekolah</span>
                                    <span class="text-sm font-bold text-slate-800">SMP Negeri 1 Merdeka</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-400 font-bold uppercase">Nilai Rata-rata</span>
                                    <span class="text-sm font-bold text-ppdb-primary italic">88.50</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Checklist Dokumen</h3>
                            <div class="space-y-4">
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
                                    <input type="checkbox" class="w-4 h-4 text-ppdb-primary rounded focus:ring-ppdb-primary">
                                    <span class="text-xs font-semibold">Ijazah/SKL Terbaca Jelas</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
                                    <input type="checkbox" class="w-4 h-4 text-ppdb-primary rounded focus:ring-ppdb-primary">
                                    <span class="text-xs font-semibold">KK Sesuai Domisili</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
                                    <input type="checkbox" class="w-4 h-4 text-ppdb-primary rounded focus:ring-ppdb-primary">
                                    <span class="text-xs font-semibold">Akta Kelahiran Asli</span>
                                </label>
                            </div>

                            <div class="mt-6">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Catatan Verifikator</label>
                                <textarea placeholder="Tulis alasan jika berkas ditolak..." class="w-full h-24 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-1 focus:ring-ppdb-primary"></textarea>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <button class="bg-red-50 text-red-600 py-3 rounded-xl font-bold text-xs border border-red-100 hover:bg-red-100 transition-all">
                                TOLAK BERKAS
                            </button>
                            <button class="bg-ppdb-primary text-white py-3 rounded-xl font-bold text-xs shadow-lg shadow-green-200 hover:bg-green-700 transition-all">
                                TERIMA & LOLOS
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
